# /etc/nginx/sites-available/mail.afrisafe.org.conf
# NEW vhost — matches server_name mail.afrisafe.org ONLY.
# No existing site, default_server, or vhost on 75.119.138.228 is touched.

server {
    listen 80;
    listen [::]:80;
    server_name mail.afrisafe.org;

    # Let certbot answer the HTTP-01 challenge from disk.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Before the certificate exists, this block also proxies so the tracking
    # links work over plain HTTP immediately. After certbot runs, replace the
    # proxy block below with:  return 301 https://$host$request_uri;
    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

